<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F7F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1313" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jeremina">
<meta name="description" content="Mina & Jeremy's shared calendar, expenses and to-dos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=4" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<title>Jeremina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
/* Theme: tiffany blue (main) + coral (attention). Phone first; ≥960px gets a left rail. */
:root{
  --bg:#F2F7F7; --card:#FFFFFF; --sunken:#E6EFEF; --soft:#F7FBFB; --line:#DDE8E8; --line2:#C9D9D8;
  --fg:#122120; --fg2:#465A59; --fg3:#647877; --fg4:#93A6A5; --ring:#B4C7C6;
  --accent:#0ABAB5; --accent-ink:#087A76; --accent-weak:#DDF5F4; --on-accent:#062F2D;
  --accent2:#F26B5B; --accent2-ink:#B03F33; --accent2-weak:#FFECE8; --on-accent2:#FFFFFF;
  --sun:#E5484D; --sat:#2E6FD8; --ok:#0B7F5C; --ok-weak:#E3F7EF; --danger:#D22030;
  --blue:#3182F6; --blue-w:#E8F2FE; --blue-i:#1B64DA;
  --violet:#8B5CF6; --violet-w:#F1EBFE; --violet-i:#6D3FD8;
  --red:#F04452; --red-w:#FDECEE; --red-i:#C81E2E;
  --orange:#FF8A1F; --orange-w:#FFF1E3; --orange-i:#B85A00;
  --green:#12B886; --green-w:#E3F7EF; --green-i:#0B7F5C;
  --gray:#8B95A1; --gray-w:#EEF0F3; --gray-i:#4E5968;
  --navy:#2E4A7D; --mustard:#E0A21B;
  --scrim:rgba(8,30,29,.42); --glass:rgba(255,255,255,.9);
  --ff:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0B1313; --card:#131F1F; --sunken:#1B2928; --soft:#162322; --line:#233332; --line2:#2F4241;
  --fg:#E6F2F1; --fg2:#A6BCBA; --fg3:#869C9A; --fg4:#617574; --ring:#3E5352;
  --accent:#0ABAB5; --accent-ink:#5ED8D3; --accent-weak:#0F3331; --on-accent:#062F2D;
  --accent2:#FF8A7A; --accent2-ink:#FFB3A8; --accent2-weak:#3A1E1A; --on-accent2:#2A0E0A;
  --sun:#FF7A7E; --sat:#7EA8F0; --ok:#6EE0B8; --ok-weak:#12392D; --danger:#FF8A93;
  --blue-w:#17305A; --blue-i:#8DBBFB; --violet-w:#2C2150; --violet-i:#C4B0FC; --red-w:#43181D; --red-i:#FF9AA2;
  --orange-w:#432A12; --orange-i:#FFB66E; --green-w:#12392D; --green-i:#6EE0B8; --gray-w:#2A3036; --gray-i:#B0B8C1;
  --navy:#7E9BD6; --mustard:#F0BE55; --scrim:rgba(0,0,0,.6); --glass:rgba(19,31,31,.9); color-scheme:dark}}
.k-blue{--k:var(--blue);--kw:var(--blue-w);--ki:var(--blue-i)}
.k-violet{--k:var(--violet);--kw:var(--violet-w);--ki:var(--violet-i)}
.k-red{--k:var(--red);--kw:var(--red-w);--ki:var(--red-i)}
.k-orange{--k:var(--orange);--kw:var(--orange-w);--ki:var(--orange-i)}
.k-green{--k:var(--green);--kw:var(--green-w);--ki:var(--green-i)}
.k-gray{--k:var(--gray);--kw:var(--gray-w);--ki:var(--gray-i)}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ff);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.45}
button{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:flex;min-height:100%}
.side{display:none}
.main{flex:1;min-width:0;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(200px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:5px;gap:4px;z-index:20;max-width:520px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:16px;color:var(--fg3);font-size:13px;font-weight:600;letter-spacing:0;transition:color .15s,background .15s}
.tab[aria-current="page"]{color:var(--accent-ink);background:var(--accent-weak)}
.tab svg,.nav svg{width:22px;height:22px}
.gated .tabbar,.gated .fab,.gated .side .nav{display:none!important}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:2px;width:228px;flex-shrink:0;padding:36px 14px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
  .brand{font-size:18.5px;font-weight:700;padding:0 12px 28px;display:flex;align-items:center;gap:10px}
  .brand svg{width:30px;height:30px}
  .nav{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;color:var(--fg2);font-size:17px;font-weight:500}
  .nav:hover{background:var(--sunken)}
  .nav[aria-current="page"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
  .nav.bottom{margin-top:auto}
  .tabbar{display:none}
  .main{padding:40px 40px 110px}
  .wrap{max-width:760px;gap:16px}
  .fab{right:40px!important;bottom:36px!important}
}

.h-sub{font-size:16px;font-weight:500;color:var(--fg3)}
.h-big{font-size:26px;font-weight:700;line-height:1.2;letter-spacing:-.03em}
.h-page{font-size:25px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
@media (min-width:960px){.h-big{font-size:32px}.h-page{font-size:30px}}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flush{padding:6px 0;gap:0}
.card-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-title b{font-size:15px;font-weight:600;color:var(--fg3);letter-spacing:.02em}
.link{font-size:15px;color:var(--fg3);font-weight:500}
.muted{color:var(--fg3)}
.empty{font-size:16px;color:var(--fg3);padding:4px 0;line-height:1.55}
.empty-box{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:26px 18px;color:var(--fg3);font-size:16px}
.empty-box b{color:var(--fg);font-size:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{height:37px;padding:0 14px;border-radius:19px;font-size:15.5px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--fg2);white-space:nowrap;flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{background:var(--sunken);border-radius:12px;padding:3px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.seg button{height:39px;border-radius:9px;text-align:center;font-size:16px;font-weight:500;color:var(--fg3);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.iconbtn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--fg2);flex-shrink:0}
.iconbtn:hover{background:var(--sunken)}
.btn{height:53px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:600;text-align:center;padding:0 20px}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--sunken);color:var(--fg2)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{height:36px;border-radius:10px;font-size:16px;padding:0 14px}
.btn.coral{background:var(--accent2);color:var(--on-accent2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fine{font-size:14px;color:var(--fg3);line-height:1.6;margin:0}
.textlink{font-size:15px;color:var(--fg3);text-align:center;padding:6px;text-decoration:underline;text-underline-offset:3px}

/* rows */
.item{display:flex;align-items:center;gap:12px;padding:11px 18px;min-height:54px;width:100%;border-top:1px solid var(--soft)}
.card.flush .item:first-child{border-top:0}
.check{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--ring);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--on-accent)}
.check.sq{border-radius:6px}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg{width:13px;height:13px;opacity:0}
.check.on svg{opacity:1}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.item .txt b{font-size:17.5px;font-weight:500;overflow-wrap:anywhere}
.item .txt small{font-size:14px;color:var(--fg3)}
.item.done .txt b{color:var(--fg4);text-decoration:line-through}
.group-label{padding:14px 18px 6px;font-size:13.5px;font-weight:600;color:var(--fg3);letter-spacing:.04em;display:flex;justify-content:space-between}
.pill{font-size:13.5px;font-weight:600;padding:3px 8px;border-radius:8px;flex-shrink:0;color:var(--fg2);background:var(--sunken);white-space:nowrap}
.pill.hot{background:var(--accent2-weak);color:var(--accent2-ink)}
.pill.ok{background:var(--ok-weak);color:var(--ok)}
.who{font-size:13.5px;font-weight:600;color:var(--fg3);flex-shrink:0}
.ptag{display:inline-block;font-size:12px;font-weight:600;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px;letter-spacing:0;white-space:nowrap}
.ptag.together{background:var(--sunken);color:var(--fg2)}
.av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:11px;font-size:12px;font-weight:700;letter-spacing:0;flex-shrink:0;line-height:1;font-style:normal}
.av.md{width:31px;height:31px;border-radius:16px;font-size:15px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--line2)}
.av.lg{width:40px;height:40px;border-radius:20px;font-size:18.5px}
.avs{display:inline-flex}.avs .av+.av{margin-left:-6px;box-shadow:0 0 0 2px var(--card)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.linkchip{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--accent2-weak);color:var(--accent2-ink);text-decoration:none;max-width:100%;overflow:hidden;white-space:nowrap}
.txtw{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.txtw .txt{flex:none}
.item .txt small.bnote::before{content:"· "}

/* home */
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.head{display:flex;flex-direction:column;gap:6px;padding:0 2px 4px}
.hbtns{display:flex;gap:2px;align-items:center}
.couple{display:inline-flex;align-items:center;gap:6px;background:var(--accent-weak);color:var(--accent-ink);border-radius:99px;padding:4px 11px 4px 4px;font-size:14px;font-weight:600;align-self:flex-start}
.couple.wait{background:var(--sunken);color:var(--fg3)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--accent2-weak);color:var(--accent2-ink);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:600;line-height:1.45}
.alert div{display:flex;flex-direction:column;gap:2px}
.notice{border:1px dashed var(--line2);color:var(--fg2);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:15.5px;font-weight:500}
.notice span{flex:1}
.notice button{font-weight:600;color:var(--accent-ink);white-space:nowrap}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat3 .s{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.stat3 .s small{font-size:13.5px;color:var(--fg3);font-weight:500}
.stat3 .s b{font-size:23px;font-weight:700;color:var(--fg2)}
.stat3 .s.main{border-color:var(--accent);background:var(--accent-weak)}
.stat3 .s.main b{color:var(--accent-ink);font-size:27.5px}
.stat3 .s.main[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.stat3 .s.main[aria-pressed="true"] b,.stat3 .s.main[aria-pressed="true"] small{color:var(--on-accent)}

/* calendar */
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 6px 10px}
.cal-wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:13.5px;font-weight:600;color:var(--fg3);padding-bottom:6px}
.cal-wd .sun{color:var(--sun)}.cal-wd .sat{color:var(--sat)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--soft)}
.day{min-height:92px;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:4px 0 6px;min-width:0;overflow:hidden;text-align:left}
.day.blank{pointer-events:none}
.dn{width:29px;height:29px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:15.5px;font-weight:500;align-self:center;flex-shrink:0}
.day.sun .dn,.day.hol .dn{color:var(--sun)}
.day.sat .dn{color:var(--sat)}
.day.today .dn{background:var(--accent);color:var(--on-accent);font-weight:700}
.hname{font-size:9.5px;line-height:1.15;height:12px;color:var(--sun);text-align:center;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bars{display:flex;flex-direction:column;gap:2px;min-width:0}
.mbar{display:flex;align-items:center;gap:3px;height:17px;font-size:11px;font-weight:600;line-height:17px;background:var(--kw);color:var(--ki);white-space:nowrap;overflow:hidden;padding:0 3px;margin:0}
.mbar.st{margin-left:2px;border-top-left-radius:5px;border-bottom-left-radius:5px}
.mbar.en{margin-right:2px;border-top-right-radius:5px;border-bottom-right-radius:5px}
.mbar.gap{background:transparent}
.mbar i{width:5px;height:5px;border-radius:3px;background:var(--k);flex-shrink:0;display:block}
.mchip{display:flex;align-items:center;gap:3px;height:17px;font-size:11px;font-weight:600;color:var(--ki);background:var(--kw);border-radius:5px;margin:0 2px;padding:0 3px;white-space:nowrap;overflow:hidden}
.mchip i{width:5px;height:5px;border-radius:3px;background:var(--k);flex-shrink:0;display:block}
.mchip.todo{background:transparent;color:var(--fg2);box-shadow:inset 0 0 0 1px var(--line2)}
.mchip.todo.dn2{color:var(--fg4);text-decoration:line-through}
.more{font-size:11px;color:var(--fg3);font-weight:600;text-align:center}
@media (min-width:960px){.day{min-height:118px}.mbar,.mchip{height:21px;font-size:13px;line-height:21px}.hname{font-size:11.5px}}
.evrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;border-top:1px solid var(--soft);text-align:left}
.evrow:first-child{border-top:0}
.evrow .em{width:34px;height:34px;border-radius:11px;background:var(--kw);display:flex;align-items:center;justify-content:center;font-size:19.5px;flex-shrink:0}
.evrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.evrow .tx b{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evrow .tx small{font-size:14px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel{font-size:13.5px;font-weight:700;padding:4px 9px;border-radius:9px;background:var(--sunken);color:var(--fg2);flex-shrink:0;white-space:nowrap}
.rel.soon{background:var(--accent2-weak);color:var(--accent2-ink)}
.tl{position:relative;height:min(52vh,460px);min-height:300px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;flex-shrink:0;background:var(--card)}
.tl-inner{position:relative}
.tl-h{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--soft)}
.tl-h span{position:absolute;left:4px;top:-8px;font-size:12px;color:var(--fg3);background:var(--card);padding-right:4px;font-variant-numeric:tabular-nums}
.tl-grid{position:absolute;left:48px;right:4px;top:0;bottom:0;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tl-ev{position:absolute;border-radius:8px;padding:4px 7px;display:flex;flex-direction:column;align-items:flex-start;overflow:hidden;text-align:left;font-size:14px;line-height:1.3;background:var(--kw);color:var(--ki);box-shadow:inset 3px 0 0 var(--k);touch-action:pan-y}
.tl-ev b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding-right:18px}
.tl-ev small{font-size:13px;opacity:.9}
.tl-ev.short{flex-direction:row;gap:6px;align-items:center;padding-top:2px}
.tl-ev.dragging{opacity:.9;z-index:5;box-shadow:inset 3px 0 0 var(--k),0 6px 18px rgba(0,0,0,.18)}
.tl-ev .av.tlav{position:absolute;top:3px;right:4px;width:18px;height:18px;font-size:10px}
.tl-rz{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize;touch-action:none}
.tl-rz::after{content:"";position:absolute;left:50%;bottom:3px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:currentColor;opacity:.35}
.tl-now{position:absolute;left:-6px;right:0;height:2px;background:var(--accent2);z-index:4;pointer-events:none}
.tl-now::before{content:"";position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:5px;background:var(--accent2)}
.tl-ghost{position:absolute;left:2px;right:2px;border-radius:8px;background:var(--accent-weak);border:1.5px dashed var(--accent);color:var(--accent-ink);font-size:13.5px;font-weight:600;padding:3px 7px;z-index:6;pointer-events:none}
.feed{display:flex;flex-direction:column;border:1.5px solid var(--accent2);background:var(--card);border-radius:var(--r);overflow:hidden}
.feed .fh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px;font-size:13.5px;font-weight:700;color:var(--accent2-ink);letter-spacing:.04em}
.frow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-top:1px solid var(--soft)}
.frow .em{width:34px;height:34px;border-radius:11px;background:var(--accent2-weak);display:flex;align-items:center;justify-content:center;font-size:19.5px;flex-shrink:0}
.frow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.frow .tx small{font-size:13.5px;color:var(--fg3);font-weight:600}
.frow .tx b{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .tx span{font-size:14px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* money */

.xrow .xa small{font-size:13.5px;color:var(--fg3)}

.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum3 div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sum3 small{font-size:13.5px;color:var(--fg3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum3 b{font-size:19.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum3 div:first-child{background:var(--accent-weak);border-color:var(--accent)}
.sum3 div:first-child b{color:var(--accent-ink)}
.hbar{display:grid;grid-template-columns:128px minmax(0,1fr) 96px;align-items:center;gap:8px;font-size:15px}
.hbar .t{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.hbar .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hbar:nth-child(5n+2) .t i{background:var(--accent2)}.hbar:nth-child(5n+3) .t i{background:var(--navy)}.hbar:nth-child(5n+4) .t i{background:var(--mustard)}.hbar:nth-child(5n+5) .t i{background:var(--fg4)}
.vbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:150px;padding-top:6px}

.vbars .c small{font-size:13px;color:var(--fg3)}
.vbars .c em{font-style:normal;font-size:11.5px;color:var(--fg2);font-weight:600;white-space:nowrap}
.pbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunken)}
.pbar i{display:block;height:100%}
.plegend{display:flex;justify-content:space-between;font-size:15px;font-weight:600;gap:8px}
.plegend span{display:flex;align-items:center;gap:6px}
.stepper{display:grid;grid-template-columns:minmax(0,1fr) 48px 80px 48px;gap:8px;align-items:center}
.stepper b{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.stepper button{height:44px;border-radius:12px;background:var(--sunken);font-size:25px;font-weight:600;text-align:center;color:var(--fg)}
.stepper button:disabled{opacity:.3}
.stepper span{text-align:center;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.ratebox{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:16px}

.ratebox small{font-size:13.5px;color:var(--fg3)}

.amtrow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px}
.catgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.catb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);font-size:14px;font-weight:600;text-align:center;color:var(--fg2)}
.catb span{font-size:25px;line-height:1}
.catb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak);color:var(--accent-ink)}

/* gate */
.gate{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:12px}
.gate .hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 0 6px}

.step{display:flex;align-items:center;gap:10px}

.step.done i{background:var(--green)}
.step b{font-size:18.5px}

.codein{height:58px;border:1.5px solid var(--line2);border-radius:14px;background:var(--soft);font-family:var(--fm);font-size:27.5px;letter-spacing:.2em;text-align:center;text-transform:uppercase;width:100%;outline:none}

.invite{border:1px solid var(--accent);background:var(--accent-weak);color:var(--accent-ink);border-radius:14px;padding:12px 14px;font-size:16px;font-weight:500}

/* fab: label changes per tab */
.fab{position:fixed;right:18px;bottom:calc(100px + env(safe-area-inset-bottom,0px));height:55px;padding:0 20px 0 16px;border-radius:26px;background:var(--accent2);color:var(--on-accent2);display:flex;align-items:center;gap:6px;font-size:17px;font-weight:700;box-shadow:0 8px 22px color-mix(in srgb,var(--accent2) 35%,transparent);z-index:15}
.fab svg{width:22px;height:22px}
.fab:active{transform:scale(.96)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .18s ease-out}
.sheet{position:relative;width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;animation:up .26s cubic-bezier(.2,.8,.2,1)}

.grab{width:36px;height:4px;border-radius:2px;background:var(--ring);align-self:center}
.sheet h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.sheet .sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field .lab{font-size:14px;font-weight:600;color:var(--fg3);letter-spacing:.02em}
.inp{height:51px;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:0 14px;font-size:17.5px;width:100%;outline:none}
.inp:focus{border-color:var(--accent)}
.inp.big{font-size:25px;font-weight:700;height:54px}
textarea.inp{height:84px;padding:12px 14px;resize:none;line-height:1.5}
select.inp{font-weight:500;appearance:auto}
.preview{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.preview .ph{font-size:14px;font-weight:600;color:var(--accent-ink)}
.preview .pl{font-size:17px;font-weight:500}
.preview .err{color:var(--danger);font-size:15.5px;font-weight:600}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--soft);width:100%;font-size:17px;font-weight:500}
.toggle small{display:block;font-size:13.5px;color:var(--fg3);font-weight:400}
.sw{width:46px;height:28px;border-radius:14px;background:var(--ring);position:relative;flex-shrink:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle[aria-pressed="true"] .sw{background:var(--accent)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(18px)}

.trow .tl2{font-size:15px;font-weight:600;color:var(--fg3)}
.trow .inp{height:40px;padding:0 8px;font-size:17px;background:var(--card)}

.trow .seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.tsum{font-size:16px;font-weight:600;color:var(--accent-ink)}
.ecat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ecat button{display:flex;align-items:center;gap:6px;justify-content:center;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);font-size:15.5px;font-weight:600;color:var(--fg2)}
.ecat button[aria-pressed="true"]{border-color:var(--k);background:var(--kw);color:var(--ki)}
.items{display:flex;flex-direction:column;gap:6px}
.irow{display:flex;align-items:center;gap:8px}
.irow .inp{height:44px;flex:1;min-width:0}
.irow .bul{width:22px;display:flex;justify-content:center;flex-shrink:0}
.irow .bul::before{content:"";width:6px;height:6px;border-radius:3px;background:var(--accent)}
.irow .iconbtn{width:36px;height:36px;font-size:23px;color:var(--fg4)}
.wdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wdays .chip{padding:0;text-align:center}
.inline-num{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--fg2)}
.inline-num .inp{width:90px}
.wkrow{display:flex;align-items:flex-start;gap:12px;padding:10px 18px;border-top:1px solid var(--soft)}
.wkrow.on{background:var(--accent-weak)}
.wk{width:34px;flex-shrink:0;font-weight:600;font-size:15px;padding-top:4px;color:var(--fg2)}
.wkitems{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}

.wknone{font-size:15px;color:var(--fg4);padding-top:4px}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.swb{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);font-size:15px;font-weight:500;text-align:center}

.swb[aria-pressed="true"]{border-color:var(--fg);background:var(--card)}
.swb small{font-size:13px;color:var(--fg3);font-weight:400}

.sync b{font-size:17px;font-weight:600}
.sync .whom{display:flex;align-items:center;gap:10px}
.sync .whom span{flex:1;min-width:0;font-size:15px;color:var(--fg2);overflow-wrap:anywhere}
.sync .st{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--fg3)}
.sync .st i{width:7px;height:7px;border-radius:4px;background:var(--fg4)}
.sync .st.on i{background:var(--green)}.sync .st.err i{background:var(--danger)}
.codebox{font-family:var(--fm);font-size:27.5px;font-weight:600;letter-spacing:.18em;text-align:center;padding:14px;border-radius:14px;background:var(--card);border:1px dashed var(--accent)}
.urlline{font-size:13.5px;color:var(--fg2);overflow-wrap:anywhere;font-family:var(--fm)}
.defrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.defrow:first-child{border-top:0}
.defrow .n{flex:1;font-size:16px;font-weight:500}
.defrow .v{font-size:15px;font-weight:600;color:var(--fg2);width:92px;text-align:center;font-variant-numeric:tabular-nums}
.defrow button{width:34px;height:34px;border-radius:10px;background:var(--sunken);font-size:21px;font-weight:600;text-align:center}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(156px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:15.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center;width:max-content}
.toast.show{opacity:1;transform:translateX(-50%)}

.update-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:70;background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:500;white-space:nowrap}
.update-bar button{background:var(--accent2);color:var(--on-accent2);border-radius:999px;padding:6px 12px;font-weight:600}
</style>
</head>

/* ================= Repeat rules (same engine as 미나의 하루) ================= */

function evRule(e){
  if(e.rr&&e.rr.unit)return e.rr;
  var r=e.repeat||'none',p=parse(e.date);
  if(r==='daily')return {unit:'day',every:1};
  if(r==='weekly')return {unit:'week',every:1,days:[dow(p.y,p.m,p.d)]};
  if(r==='monthly')return {unit:'month',every:1,mt:'date'};
  if(r==='yearly')return {unit:'year',every:1};
  return null;
}
function ruleMatch(date,rr,s,noUntil){
  if(s<date)return false;
  if(!noUntil&&rr.until&&s>rr.until)return false;
  var a=parse(date),b=parse(s),n=Math.max(1,+rr.every||1);
  if(rr.unit==='day')return Math.round((utc(b.y,b.m,b.d)-utc(a.y,a.m,a.d))/864e5)%n===0;
  if(rr.unit==='week'){var ds=(rr.days&&rr.days.length)?rr.days:[dow(a.y,a.m,a.d)];if(ds.indexOf(dow(b.y,b.m,b.d))<0)return false;return (weekIdx(s)-weekIdx(date))%n===0}
  var mo=(b.y-a.y)*12+(b.m-a.m);
  if(rr.unit==='month'){if(mo%n)return false;
    if(rr.mt==='nth'||rr.mt==='last'){if(dow(b.y,b.m,b.d)!==dow(a.y,a.m,a.d))return false;return rr.mt==='last'?b.d+7>dim(b.y,b.m):Math.ceil(b.d/7)===Math.ceil(a.d/7)}
    return b.d===Math.min(a.d,dim(b.y,b.m))}
  if(rr.unit==='year'){if((b.y-a.y)%n)return false;return b.m===a.m&&b.d===Math.min(a.d,dim(b.y,b.m))}
  return false;
}
function baseOn(e,s){if(s<e.date)return false;var rr=evRule(e);if(!rr)return e.date===s;return ruleMatch(e.date,rr,s)}
/* Multi-day: endDate (optional). Returns the start date of the occurrence covering s, or null. */
function evSpan(e){return e.endDate&&e.endDate>e.date?daysBetween(e.date,e.endDate):0}

function eventOn(e,s){return occStart(e,s)!=null}
function isYearly(e){var rr=evRule(e);return !!rr&&rr.unit==='year'&&(+rr.every||1)===1&&!rr.until}

function ruleTextEn(rr,date){

  else if(rr.unit==='month'){var wd=WD[dow(p.y,p.m,p.d)];t=(n===1?'Every month':'Every '+n+' months')+' on '+(rr.mt==='nth'?NTHE[String(Math.ceil(p.d/7))]+' '+wd:rr.mt==='last'?'last '+wd:'day '+p.d)}
  else if(rr.unit==='year')t=n===1?'Every year':'Every '+n+' years';
  if(rr.until)t+=' until '+md(rr.until);

}

/* ================= Routines (same engine as 미나의 하루) ================= */
function rtMatch(r,t){var p=parse(t);if(r.mode==='weekly'){if((r.days||[]).indexOf(dow(p.y,p.m,p.d))<0)return false;var w=+r.weeks||1;if(w<2)return true;var k=weekIdx(t)-weekIdx(r.anchor||r.since||TODAY);return ((k%w)+w)%w===0}if(r.mode==='yearly')return p.m===(+r.ym||1)&&p.d===Math.min(+r.yd||1,dim(p.y,p.m));if(r.mode==='monthly'){if(r.mtype==='nth'){if(dow(p.y,p.m,p.d)!==+r.mwd)return false;var n=+r.nth||1;return n>0?Math.ceil(p.d/7)===n:p.d+7>dim(p.y,p.m)}return p.d===Math.min(+r.mday||1,dim(p.y,p.m))}return false}
function rtDue(r){
  if(r.mode==='every'){var e=Math.max(1,+r.every||7);return r.last?addDays(r.last,e):(r.since||TODAY)}
  if(r.mode==='weekly'&&!(r.days||[]).length)return '9999-12-31';
  for(var b=0;b<=31;b++){var lo=addDays(TODAY,-b);if(rtMatch(r,lo)){if(lo>=(r.since||'')&&(!r.last||r.last<lo))return lo;break}}
  for(var i=1;i<=400;i++){var t=addDays(TODAY,i);if(rtMatch(r,t))return t}
  return '9999-12-31';
}
function rtFreq(r){
  if(r.mode==='weekly'){var ds=(r.days||[]).slice().sort(function(a,b){return ((a+6)%7)-((b+6)%7)});return ds.length?((+r.weeks||1)>=2?'Every other week · ':'Weekly · ')+ds.map(function(d){return WD[d]}).join(', '):'No day set'}
  if(r.mode==='yearly')return 'Yearly · '+MON[(+r.ym||1)-1]+' '+(+r.yd||1);

  return 'Every '+(+r.every||7)+' days';
}
function rtToday(){return S.routines.filter(function(r){return r.last===TODAY||rtDue(r)<=TODAY}).sort(function(a,b){var ad=a.last===TODAY,bd=b.last===TODAY;if(ad!==bd)return ad?1:-1;return rtDue(a)<rtDue(b)?-1:1})}

  if(r.last===TODAY)return {l:'Done today',cls:'pill ok'};

var seen=null,seenUnsub=null,colsReady={},seedPending=false,arrived=null;
function seenRef(){return fsdb.collection('users').doc(user.uid).collection('meta').doc('jeremina')}
function seenKey(){return 'seen-'+me()}
function saveSeenLocal(){if(seen)lsSet(seenKey(),Object.keys(seen))}
function loadSeen(){
  var loc=lsGet(seenKey(),null);
  if(Array.isArray(loc)){seen={};loc.forEach(function(id){seen[id]=1})}
  arrived=lsGet('arr-'+me(),{})||{};
  if(!fsdb||!user)return;
  if(seenUnsub){try{seenUnsub()}catch(e){}}
  seenUnsub=seenRef().onSnapshot({includeMetadataChanges:true},function(d){
    if(!d.exists){if(d.metadata.fromCache)return;
      if(seen){seenRef().set({seen:Object.keys(seen)},{merge:true}).catch(function(){})}else{seedPending=true;trySeed()}return}
    var m=seen||{};(d.data().seen||[]).forEach(function(id){m[id]=1});seen=m;saveSeenLocal();render();
  },function(){if(!seen){seedPending=true;trySeed()}});
}
/* first time on this account: whatever already exists counts as seen, so the card doesn't flood */
function trySeed(){
  if(!seedPending||SHC.some(function(c){return !colsReady[c]}))return;
  seedPending=false;var ids=[];SHC.forEach(function(c){S[c].forEach(function(x){ids.push(x.id)})});
  seen={};ids.forEach(function(id){seen[id]=1});saveSeenLocal();render();
  if(fsdb&&user)seenRef().set({seen:ids,init:true},{merge:true}).catch(function(){});
}
function markSeen(id){if(!seen)return;seen[id]=1;saveSeenLocal();render();if(fsdb&&user)seenRef().set({seen:firebase.firestore.FieldValue.arrayUnion(id)},{merge:true}).catch(function(){})}
/* everything new (from either of you), newest first; new items keep pushing in on top */
function feedItems(){
  var out=[];if(!seen)return out;
  if(!arrived)arrived=lsGet('arr-'+me(),{})||{};
  var now=Date.now(),changed=false,keep={};
  function add(col,x,kind){if(seen[x.id])return;if(!arrived[x.id]){arrived[x.id]=now;changed=true}keep[x.id]=arrived[x.id];out.push({col:col,x:x,kind:kind,t:Math.max(+x.createdAt||0,arrived[x.id])})}
  S.events.forEach(function(x){add('events',x,'event')});S.todos.forEach(function(x){add('todos',x,'task')});S.buys.forEach(function(x){add('buys',x,'shop')});
  S.routines.forEach(function(x){add('routines',x,'routine')});liveExp().forEach(function(x){add('expenses',x,isSettle(x)?'payment':'expense')});
  if(changed||Object.keys(arrived).length>Object.keys(keep).length+50){arrived=keep;lsSet('arr-'+me(),keep)}
  return out.sort(function(a,b){return b.t-a.t});
}
function feedH(){
  if(!spaceId())return '';

    if(it.kind==='event'){em='📅';lab='New event';title=x.title;sub=md(x.date)+(evSpan(x)?' – '+md(x.endDate):'')+' · '+(x.time?tLabel(x.time):'All day')}

    else if(it.kind==='expense'){var c=xcat(x);em=c[1];lab='New expense';title=x.title||c[2];sub=yen(x.jpy)+' · paid by '+fullName(x.paidBy)}

  if(isYearly(e))sub.push('Every year');else if(evRule(e))sub.push(ruleTextEn(evRule(e),e.date));

    (opt.rel!=null?'<span class="rel'+(opt.rel<=1?' soon':'')+'">'+relLabel(opt.rel)+'</span>':'')+
    (opt.del?'<button type="button" class="del'+(delArmed===e.id?' armed':'')+'" data-del-event="'+e.id+'" aria-label="Delete">'+(delArmed===e.id?'Delete?':ICON_TRASH)+'</button>':'')+'</div>';
}
function weekLanes(days){
  var occ=[],seen={};
  days.forEach(function(d){if(!d)return;S.events.forEach(function(e){if(!evSpan(e))return;var st=occStart(e,d);if(st==null)return;var key=e.id+'|'+st;if(seen[key])return;seen[key]=1;occ.push({e:e,st:st,en:addDays(st,evSpan(e)),key:key})})});
  occ.sort(function(a,b){return a.st<b.st?-1:a.st>b.st?1:(b.en<a.en?-1:1)});
  var lanes=[];occ.forEach(function(o){var i=0;while(lanes[i]&&lanes[i]>=o.st)i++;lanes[i]=o.en;o.lane=i});
  return {occ:occ,n:lanes.length};
}
function monthV(){
  var y=cal.y,m=cal.m,first=dow(y,m,1),n=dim(y,m),total=Math.ceil((first+n)/7)*7,weeks='';
  for(var w=0;w<total/7;w++){
    var days=[];for(var c=0;c<7;c++){var d=w*7+c-first+1;days.push(d>=1&&d<=n?iso(y,m,d):null)}
    var L=weekLanes(days),cells='',weekHol=days.some(function(x){return x&&holidayOn(x)});
    days.forEach(function(s,ci){
      if(!s){cells+='<span class="day blank"></span>';return}
      var hol=holidayOn(s),wd=ci,cls='day'+(wd===0?' sun':'')+(wd===6?' sat':'')+(hol?' hol':'')+(s===TODAY?' today':'');
      var bars='',maxL=Math.min(L.n,3);
      for(var li=0;li<maxL;li++){
        var o=L.occ.filter(function(x){return x.lane===li&&x.st<=s&&x.en>=s})[0];
        if(!o){bars+='<span class="mbar gap"></span>';continue}
        var isSt=o.st===s,isEn=o.en===s,showT=isSt||ci===0;
        bars+='<span class="mbar k-'+evKind(o.e)+(isSt?' st':'')+(isEn?' en':'')+'">'+(isSt?'<i></i>':'')+(showT?esc(o.e.title):'')+'</span>';
      }
      var singles=[];
      eventsOn(s).filter(function(e){return !evSpan(e)}).forEach(function(e){singles.push('<span class="mchip k-'+evKind(e)+'"><i></i>'+esc(e.title)+'</span>')});
      S.todos.filter(function(t){return t.due===s}).forEach(function(t){singles.push('<span class="mchip todo'+(t.done?' dn2':'')+'">'+esc(t.text)+'</span>')});
      var room=Math.max(1,3-maxL),more=L.occ.filter(function(x){return x.lane>=3&&x.st<=s&&x.en>=s}).length;
      var shown=singles.length>room?singles.slice(0,room-1>0?room-1:1):singles;more+=singles.length-shown.length;
      cells+='<button type="button" class="'+cls+'" data-day="'+s+'" aria-label="'+MONL[m-1]+' '+parse(s).d+(hol?', '+hol:'')+'"><span class="dn num">'+parse(s).d+'</span>'+(weekHol?'<span class="hname">'+esc(hol)+'</span>':'')+'<span class="bars">'+bars+shown.join('')+(more>0?'<span class="more">+'+more+'</span>':'')+'</span></button>';
    });

}

function upcoming(k){

/* drag on the hourly view: empty = new event, block = move, bottom edge = length (same as 미나의 하루) */
var TL=null;
function bindTimeline(tl,grid,day,inline){
  function back(){if(inline)render();else drawSheetKeep()}
  var ghost=document.getElementById('tlghost');
  function minAt(y){var r=grid.getBoundingClientRect();return Math.max(0,Math.min(1440,(y-r.top)/HPX*60))}
  function snap(m){return Math.round(m/15)*15}

  function start(){TL.active=true;if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
    if(TL.mode==='create'){TL.st=Math.max(0,Math.min(1380,snap(TL.m0)));TL.en=TL.st+(TL.touch?60:15);showGhost(TL.st,TL.en)}
    if(TL.el)TL.el.classList.add('dragging')}
  grid.addEventListener('pointerdown',function(e){
    if(e.button>0)return;
    var rz=e.target.closest('.tl-rz'),evb=e.target.closest('.tl-ev');
    TL={id:e.pointerId,touch:e.pointerType!=='mouse',y0:e.clientY,m0:minAt(e.clientY),active:false,moved:false};
    if(evb){var ev=find('events',evb.dataset.tlev);if(!ev)return;TL.ev=ev;TL.el=evb;TL.s0=toMin(ev.time);TL.e0=evEndMin(ev);TL.mode=rz?'resize':'move'}
    else TL.mode='create';
    if(!TL.touch||rz){if(rz){TL.active=true;evb.classList.add('dragging')}}
    else TL.timer=setTimeout(function(){if(TL&&!TL.moved)start()},380);
    try{grid.setPointerCapture(e.pointerId)}catch(_){}
  });
  grid.addEventListener('pointermove',function(e){
    if(!TL||e.pointerId!==TL.id)return;
    var dy=e.clientY-TL.y0;
    if(!TL.active){if(Math.abs(dy)>6){TL.moved=true;if(TL.touch){clearTimeout(TL.timer);TL=null;return}start()}else return}
    autoScroll(e.clientY);
    var m=minAt(e.clientY);

    else if(TL.mode==='move'){var d=snap(m-TL.m0),len=TL.e0-TL.s0,ns=Math.max(0,Math.min(1440-len,TL.s0+d));TL.ns=ns;TL.ne=ns+len;TL.el.style.top=(ns/60*HPX)+'px';TL.el.querySelector('small').textContent=tLabel(fromMin(ns))+' – '+tLabel(fromMin(Math.min(ns+len,1439)))}
    else if(TL.mode==='resize'){var ne=Math.max(TL.s0+15,Math.min(1440,snap(m)));TL.ne=ne;TL.ns=TL.s0;TL.el.style.height=Math.max(18,(ne-TL.s0)/60*HPX-2)+'px';TL.el.querySelector('small').textContent=tLabel(fromMin(TL.s0))+' – '+tLabel(fromMin(Math.min(ne,1439)))}
  });
  function end(e,cancel){
    if(!TL||e.pointerId!==TL.id)return;var t=TL;TL=null;clearTimeout(t.timer);ghost.hidden=true;

    if(!t.active){
      if(t.moved)return;
      if(t.ev){closeSheet();editEvent(t.ev,inline?'':day);return}
      var st=Math.min(1380,Math.floor(t.m0/60)*60);closeSheet();newFor('event',{date:day,back:inline?'':day,st:st,en:st+60});return;
    }
    if(t.mode==='create'){closeSheet();newFor('event',{date:day,back:inline?'':day,st:t.st,en:t.en});return}
    if((t.mode==='move'||t.mode==='resize')&&t.ns!=null&&(t.ns!==t.s0||t.ne!==t.e0)){var ne=copy(t.ev);ne.time=fromMin(t.ns);ne.end=fromMin(Math.min(t.ne,1439));put('events',ne);back();toast((evRule(t.ev)?'Moved all repeats to ':'Moved to ')+tLabel(ne.time));return}
    back();
  }
  grid.addEventListener('pointerup',function(e){end(e,false)});

}

/* ================= Expenses (Tricount style) =================
   spaces/{sid}/expenses
   expense: {kind:'expense', cat, amount, cur, rate (JPY per unit), jpy, date, paidBy, pct:{uid:%}, owe:{uid:JPY}, title (description), createdAt, by}
   payment: {kind:'settle', from, to, jpy, date, note, createdAt, by}   (from paid to) */
function isSettle(x){return x.kind==='settle'}
/* Deleted expenses are never removed from the server: they get `deleted` (time) and go to Trash. */
function liveExp(){return S.expenses.filter(function(x){return !x.deleted})}
function trashExp(){return S.expenses.filter(function(x){return x.deleted}).sort(function(a,b){return b.deleted-a.deleted})}
function shareOf(x,u){return +((x.owe||{})[u])||0}
function netBalances(){
  var net={},paid={};members().forEach(function(u){net[u]=0;paid[u]=0});
  liveExp().forEach(function(x){
    if(isSettle(x)){net[x.from]=(net[x.from]||0)+(+x.jpy||0);net[x.to]=(net[x.to]||0)-(+x.jpy||0);return}
    net[x.paidBy]=(net[x.paidBy]||0)+(+x.jpy||0);paid[x.paidBy]=(paid[x.paidBy]||0)+(+x.jpy||0);
    var o=x.owe||{};Object.keys(o).forEach(function(u){net[u]=(net[u]||0)-(+o[u]||0)});
  });
  return {net:net,paid:paid};
}
function balance(){
  var nb=netBalances(),a=me(),b=partnerUid(),v=Math.round(nb.net[a]||0);
  if(!b||Math.abs(v)<1)return {even:true,amt:0,paid:nb.paid};
  return v>0?{from:b,to:a,amt:v,paid:nb.paid}:{from:a,to:b,amt:-v,paid:nb.paid};
}
function balLine(inline){var bl=balance();if(bl.even)return "You're even 🎉";return esc(fullName(bl.from))+' owes '+esc(fullName(bl.to))+(inline?' <span style="color:var(--accent2-ink)">'+yen(bl.amt)+'</span>':'')}
function defPct(cat){var P=people(),d=space&&space.splitDef2&&space.splitDef2[cat];if(d!=null&&isFinite(+d))return +d;return cat==='grocery'?(P[0]===jUid()?60:40):50}
function pctLabel(x){var P=people(),p=x.pct;if(!p){var j=+x.jpy||0;if(!j)return '';p={};P.forEach(function(u){p[u]=Math.round(shareOf(x,u)/j*100)})}
  var a=+p[P[0]]||0,b=100-a;if(a===100)return fullName(P[0])+' only';if(a===0)return fullName(P[1])+' only';return fullName(P[0])+' '+a+' / '+fullName(P[1])+' '+b}
function expCalc(d){
  var amt=numIn(d.amount),cur=d.cur||'JPY',rate=cur==='JPY'?1:(+d.rate||0),P=people();
  var r={jpy:0,owe:{},ok:false,err:''};
  if(!amt)return r;
  if(cur!=='JPY'&&!rate){r.err='Enter the exchange rate';return r}
  r.jpy=Math.round(amt*rate);
  if(P.length<2){r.err='Connect your partner to split expenses';return r}
  var a=Math.max(0,Math.min(100,+d.pa));r.owe[P[0]]=Math.round(r.jpy*a/100);r.owe[P[1]]=r.jpy-r.owe[P[0]];
  r.ok=true;return r;
}
function expPreview(d){

var RATES=lsGet('rates',{});
function fetchJSON(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
function pickJPY(j){if(!j)return 0;if(j.rates&&+j.rates.JPY)return +j.rates.JPY;if(+j.rate)return +j.rate;if(Array.isArray(j)){for(var i=0;i<j.length;i++){var x=j[i];if(x&&(x.quote==='JPY'||x.symbol==='JPY')&&+x.rate)return +x.rate}}return 0}
function fetchRate(cur,date){
  if(cur==='JPY')return Promise.resolve({rate:1,src:''});
  var k=cur+'|'+date;if(RATES[k])return Promise.resolve(RATES[k]);
  var day=date>TODAY?TODAY:date;
  var tries=['https://api.frankfurter.dev/v1/'+day+'?base='+cur+'&symbols=JPY','https://api.frankfurter.dev/v2/rates?date='+day+'&base='+cur+'&quotes=JPY','https://open.er-api.com/v6/latest/'+cur];
  function t(i){if(i>=tries.length)return Promise.reject();return fetchJSON(tries[i]).then(function(j){var r=pickJPY(j);if(!r)throw 0;var o={rate:r,src:i<2?(j.date||day):'latest'};if(i<2){RATES[k]=o;lsSet('rates',RATES)}return o}).catch(function(){return t(i+1)})}
  return t(0);
}

    navigator.clipboard.writeText(txt).then(function(){toast('Invite link copied')},fb)}catch(e){fb()}
}
var pendingJoin='',lastCode='',joining=false;
function readInvite(){
  try{var q=new URLSearchParams(location.search).get('join');if(q){q=q.toUpperCase().replace(/[^A-Z0-9]/g,'');if(q.length===8)lsSet('join',q);history.replaceState(null,'',location.pathname)}}catch(e){}
  pendingJoin=lsGet('join','')||'';
}
function tryInvite(){
  if(!pendingJoin||!user)return;
  var code=pendingJoin;pendingJoin='';lsSet('join','');lastCode=code;
  if(spaceId()){if(spaceId()!==code)toast("You're already in another shared space");return}
  joining=true;render();joinSpace(code);
}
function initCloud(){
  if(!window.firebase||!firebase.auth||!firebase.firestore){loadFailed=true;render();return}
  try{
    if(!firebase.apps.length)firebase.initializeApp(FB_CFG);
    fsdb=firebase.firestore();
    try{fsdb.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
    cloudReady=true;
    firebase.auth().getRedirectResult().catch(authErr);
    firebase.auth().onAuthStateChanged(function(u){
      var was=user;user=u||null;authKnown=true;
      stopSpace();
      if(user){if(!was&&!cachedSid&&!pendingJoin)toast('Signed in');emailOpen=false;syncState='loading';metaKnown=false;loadSpace()}
      else{syncState='off';metaKnown=false;clearAll()}
      redraw();
    });
  }catch(e){loadFailed=true;render()}
}
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function loadFirebase(){
  var VS='10.14.1',bases=['https://www.gstatic.com/firebasejs/'+VS+'/','https://cdn.jsdelivr.net/npm/firebase@'+VS+'/'];
  function tryBase(i){
    if(i>=bases.length)return Promise.reject();
    var B=bases[i];
    return loadScript(B+'firebase-app-compat.js').then(function(){return Promise.all([loadScript(B+'firebase-auth-compat.js'),loadScript(B+'firebase-firestore-compat.js')])}).catch(function(){return tryBase(i+1)});
  }
  tryBase(0).then(function(){initCloud()}).catch(function(){loadFailed=true;render()});
}

/* ================= New version check ================= */
function checkUpdate(){
  try{fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){
    var m=t&&t.match(/var APPV='(\d+)'/);if(!m||+m[1]<=+APPV)return;
    if(sheet.hidden&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))){location.reload();return}
    if(document.getElementById('upd'))return;
    var b=document.createElement('div');b.className='update-bar';b.id='upd';b.innerHTML='<span>A new version is ready</span><button type="button">Update</button>';b.querySelector('button').onclick=function(){location.reload()};document.body.appendChild(b);
  }).catch(function(){})}catch(e){}
}

/* ================= Start ================= */
(function boot(){
  readInvite();
  var C=lsGet('cache',null);
  if(C&&C.sid){cachedSid=C.sid;cachedUid=C.uid||'';if(C.space)space=C.space;SHC.forEach(function(c){S[c]=Array.isArray(C[c])?C[c]:[]})}
  render();
  loadFirebase();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){var n=nowLocal(),t=iso(n.y,n.m,n.d);if(t!==TODAY){location.reload();return}checkUpdate()}});
  setTimeout(checkUpdate,3000);
})();
})();
