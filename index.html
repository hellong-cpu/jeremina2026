<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F7F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1313" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jeremina">
<meta name="description" content="우리 둘의 일정·할 일·살 것·루틴·지출을 한곳에서">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<title>Jeremina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
/* 미나의 하루와 같은 바탕: 종이색 배경, 얇은 선의 흰 카드, 핫핑크 포인트 하나.
   폰 = 한 줄 + 떠 있는 탭바, 960px 이상 = 왼쪽 메뉴 + 넓은 화면 */
:root{
  --bg:#F2F7F7; --card:#FFFFFF; --sunken:#E6EFEF; --soft:#F7FBFB; --line:#DDE8E8; --line2:#C9D9D8;
  --fg:#122120; --fg2:#465A59; --fg3:#647877; --fg4:#93A6A5; --ring:#B4C7C6;
  --accent:#0ABAB5; --accent-ink:#087A76; --accent-weak:#DDF5F4; --on-accent:#062F2D;
  --peach:#FF8A7A; --peach-weak:#FFECE8; --peach-ink:#B03F33;
  --red:#C2362B; --red-weak:#FBEAE7; --sat:#2B5FB8;
  --violet:#6B3FC4; --violet-weak:#F0EAFB; --violet-dot:#8B63E0;
  --green:#1E6B57; --green-weak:#E2EFE9; --green-dot:#2E9A7C;
  --orange:#9A4A0B; --orange-weak:#FBEFE3; --orange-dot:#E07B2A;
  --blue:#2B5FB8; --blue-weak:#E7EEFA; --blue-dot:#3A73D6;
  --star:#E0A21B; --scrim:rgba(8,30,29,.42); --glass:rgba(255,255,255,.88);
  --ff:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  --r:18px; --r-ctl:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1313; --card:#131F1F; --sunken:#1B2928; --soft:#162322; --line:#233332; --line2:#2F4241;
  --fg:#E6F2F1; --fg2:#A6BCBA; --fg3:#869C9A; --fg4:#617574; --ring:#3E5352;
  --accent:#0ABAB5; --accent-ink:#5ED8D3; --accent-weak:#0F3331; --on-accent:#062F2D;
  --peach:#FF9C8E; --peach-weak:#3A1E1A; --peach-ink:#FFB3A8;
  --red:#FF7A6E; --red-weak:#3A1D1A; --sat:#82A8F0;
  --violet:#C3A6FF; --violet-weak:#2A2340; --violet-dot:#A786F5;
  --green:#86D6BC; --green-weak:#16302A; --green-dot:#4FBF9C;
  --orange:#FFB27A; --orange-weak:#382616; --orange-dot:#F0904A;
  --blue:#9CBBF5; --blue-weak:#1B2742; --blue-dot:#6C98EC;
  --star:#F0BE55; --scrim:rgba(0,0,0,.6); --glass:rgba(19,31,31,.88); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1313; --card:#131F1F; --sunken:#1B2928; --soft:#162322; --line:#233332; --line2:#2F4241;
  --fg:#E6F2F1; --fg2:#A6BCBA; --fg3:#869C9A; --fg4:#617574; --ring:#3E5352;
  --accent:#0ABAB5; --accent-ink:#5ED8D3; --accent-weak:#0F3331; --on-accent:#062F2D;
  --peach:#FF9C8E; --peach-weak:#3A1E1A; --peach-ink:#FFB3A8;
  --red:#FF7A6E; --red-weak:#3A1D1A; --sat:#82A8F0;
  --violet:#C3A6FF; --violet-weak:#2A2340; --violet-dot:#A786F5;
  --green:#86D6BC; --green-weak:#16302A; --green-dot:#4FBF9C;
  --orange:#FFB27A; --orange-weak:#382616; --orange-dot:#F0904A;
  --blue:#9CBBF5; --blue-weak:#1B2742; --blue-dot:#6C98EC;
  --star:#F0BE55; --scrim:rgba(0,0,0,.6); --glass:rgba(19,31,31,.88); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ff);letter-spacing:-.015em;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:flex;min-height:100%}
.side{display:none}
.main{flex:1;min-width:0;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(170px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* tab bar: floating glass pill */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:5px;gap:4px;z-index:20;max-width:520px;margin:0 auto}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:16px;color:var(--fg3);font-size:10.5px;font-weight:600;letter-spacing:0;transition:color .15s,background .15s}
.tab[aria-current="page"]{color:var(--accent-ink);background:var(--accent-weak)}
.tab svg,.nav svg{width:22px;height:22px}
.gated .tabbar,.gated .fab,.gated .side .nav{display:none!important}

/* desktop rail */
@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:2px;width:236px;flex-shrink:0;padding:36px 14px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line)}
  .brand{font-size:16px;font-weight:700;padding:0 12px 28px;display:flex;align-items:center;gap:10px}
  .brand svg{width:30px;height:30px;flex-shrink:0}
  .nav{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;color:var(--fg2);font-size:15px;font-weight:500;transition:background .15s,color .15s}
  .nav:hover{background:var(--sunken);color:var(--fg)}
  .nav[aria-current="page"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
  .nav.bottom{margin-top:auto}
  .tabbar{display:none}
  .main{padding:40px 40px 72px}
  .wrap{max-width:1080px;gap:18px}
  .fab{right:40px!important;bottom:40px!important}
}

/* type */
.h-sub{font-size:14px;font-weight:500;color:var(--fg3)}
.h-big{font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.035em;text-wrap:balance}
.h-page{font-size:26px;font-weight:700;letter-spacing:-.035em}
.head{padding:0 2px 10px;display:flex;flex-direction:column;gap:6px}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 4px}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.flush{padding:6px 0;gap:0}
.card-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-title b{font-size:13px;font-weight:600;color:var(--fg3);letter-spacing:.02em}
.link{font-size:13px;color:var(--fg3);font-weight:500;transition:color .15s}
.link:hover{color:var(--fg)}
.muted{color:var(--fg3)}
.empty{font-size:14px;color:var(--fg3);padding:2px 0}
.dot{width:7px;height:7px;border-radius:4px;flex-shrink:0}
.ev{display:flex;align-items:center;gap:12px;width:100%;min-height:30px}
.ev .t{font-family:var(--fm);font-size:12.5px;color:var(--fg3);width:44px;flex-shrink:0;letter-spacing:0}
.ev .n{font-size:15.5px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .note{font-size:12px;color:var(--fg3);flex-shrink:0}
.pill{font-family:var(--fm);font-size:12px;font-weight:500;letter-spacing:0;padding:4px 8px;border-radius:8px;flex-shrink:0;color:var(--fg2);border:1px solid var(--line)}
.pill.hot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill.past{color:var(--fg4)}
.pill.ok{background:var(--green-weak);border-color:var(--green-weak);color:var(--green);font-family:var(--ff);font-weight:600}
.c-blue{background:var(--blue-dot)} .c-green{background:var(--green-dot)} .c-orange{background:var(--orange-dot)} .c-violet{background:var(--violet-dot)} .c-red{background:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tap{transition:transform .1s,background .15s,border-color .15s}
.tap:active{transform:scale(.99)}
button.card:hover,button.mini:hover{border-color:var(--line2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 13px;border-radius:17px;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--fg2);transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--line2)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip.soft{background:transparent}
.chip.soft[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent-ink)}
.seg{background:var(--sunken);border-radius:12px;padding:3px;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px}
.seg button{height:36px;border-radius:9px;text-align:center;font-size:14px;font-weight:500;color:var(--fg3);transition:background .15s,color .15s;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.iconbtn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--fg2);transition:background .15s;position:relative;flex-shrink:0}
.iconbtn:hover{background:var(--sunken)}
.btn{height:50px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:15px;font-weight:600;text-align:center;padding:0 20px;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.3;cursor:default}
.btn.pink{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--sunken);color:var(--fg2)}
.btn.danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{height:36px;border-radius:10px;font-size:14px;padding:0 14px}
.quick{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:3px 3px 3px 14px;background:var(--soft);transition:border-color .15s}
.quick:focus-within{border-color:var(--accent)}
.quick input{flex:1;min-width:0;border:0;background:transparent;font-size:14.5px;height:38px;outline:none}
.quick .btn{background:var(--accent);color:var(--on-accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* check rows */
.item{display:flex;align-items:center;gap:14px;padding:11px 20px;min-height:54px;width:100%;border-top:1px solid var(--soft)}
.check{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--ring);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--on-accent);transition:background .15s,border-color .15s}
.check:hover{border-color:var(--accent)}
.check.sq{border-radius:6px}
.check.on{background:var(--accent);border-color:var(--accent)}
.check svg{width:13px;height:13px;opacity:0}
.check.on svg{opacity:1}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left}
.item .txt b{font-size:15.5px;font-weight:500;overflow-wrap:anywhere}
.item .txt small{font-size:12.5px;color:var(--fg3)}
.item.done .txt b{color:var(--fg4);text-decoration:line-through;text-decoration-thickness:1px}
.group-label{padding:14px 20px 6px;font-size:12px;font-weight:600;color:var(--fg3);letter-spacing:.04em;display:flex;justify-content:space-between}
.star{color:var(--star)}
.who{font-size:11.5px;font-weight:600;color:var(--fg3);flex-shrink:0}

/* calendar */
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 4px 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.wd{text-align:center;font-size:11.5px;font-weight:500;color:var(--fg3);padding-bottom:8px}
.wd.sun{color:var(--red)} .wd.sat{color:var(--sat)}
.day{min-height:86px;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:3px 1px 5px;border-radius:10px;min-width:0;overflow:hidden}
.day .dn{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;align-self:center;flex-shrink:0;transition:background .15s,color .15s}
.day.sun .dn,.day.hol .dn{color:var(--red)}
.day.sat .dn{color:var(--sat)}
.day.today .dn{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent-ink);font-weight:700}
.day.sel .dn{background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:none}
.day .chiplist{display:flex;flex-direction:column;gap:2px;min-width:0}
.day .chiplist span{display:block;font-size:10px;line-height:1.4;font-weight:500;padding:1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:clip;letter-spacing:-.05em}
.day .chiplist .more{background:none;color:var(--fg3);text-align:center;padding:0;font-weight:600}
.day .tm{display:none}
.chc-blue{background:var(--blue-weak);color:var(--blue)}.chc-green{background:var(--green-weak);color:var(--green)}.chc-orange{background:var(--orange-weak);color:var(--orange)}.chc-violet{background:var(--violet-weak);color:var(--violet)}.chc-red{background:var(--red-weak);color:var(--red)}
.ch-jp{background:var(--orange-weak);color:var(--orange)}
.ch-hol{background:var(--red-weak);color:var(--red)}
.ch-todo{background:transparent!important;color:var(--fg2);box-shadow:inset 0 0 0 1px var(--line2)}
.ch-todo.dn{color:var(--fg4);text-decoration:line-through}
@media (min-width:960px){
  .cal{padding:16px}
  .cal-grid{gap:0}
  .cal-grid + .cal-grid{border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .day{min-height:112px;height:auto;align-items:stretch;padding:6px;gap:3px;border-radius:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .15s}
  .day .dn{width:26px;height:26px;font-size:13px;align-self:flex-start}
  .day .tm{display:inline}
  .day .chiplist{gap:3px}
  .day .chiplist span{font-size:11px;font-weight:500;padding:2px 6px;border-radius:5px;letter-spacing:0;text-overflow:ellipsis}
  .day:hover{background:var(--soft)}
  .day.sel{background:var(--soft)}
  .day.blank:hover{background:transparent}
}
.cal-wrap{display:flex;flex-direction:column;gap:14px}
@media (min-width:960px){.cal-wrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:18px;align-items:start}}

/* home */
.home-grid{display:flex;flex-direction:column;gap:14px}
.home-col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:960px){
  .home-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
  .home-col{gap:18px}
}
.stat{font-size:24px;font-weight:700;letter-spacing:-.03em}
.mini{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;min-width:0}
.notice{border:1px dashed var(--line2);color:var(--fg2);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:500}
.notice span{flex:1}
.notice button{font-weight:600;color:var(--accent-ink);white-space:nowrap}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.couple{display:inline-flex;align-items:center;gap:6px;background:var(--accent-weak);color:var(--accent-ink);border-radius:99px;padding:5px 11px 5px 5px;font-size:12.5px;font-weight:600;white-space:nowrap}
.couple i{display:block;width:20px;height:20px;border-radius:10px;border:2px solid var(--accent-weak)}
.couple i+i{margin-left:-8px}
.couple.wait{background:var(--sunken);color:var(--fg3)}
.balcard{display:flex;align-items:center;gap:12px;width:100%}
.balcard .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-weak);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.balcard .bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.balcard small{font-size:12px;color:var(--fg3);font-weight:500}
.balcard b{font-size:15.5px;font-weight:600;overflow-wrap:anywhere}
.amt{color:var(--accent-ink);font-variant-numeric:tabular-nums}

/* money */
.bal{display:flex;flex-direction:column;gap:14px}
.bal-line{font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1.4}
.bal-line.even{color:var(--green)}
.bal-sub{font-size:13px;color:var(--fg3)}
.mhead{display:flex;align-items:center;gap:2px}
.mhead b{font-size:15px;font-weight:700;min-width:110px;text-align:center}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tot b{font-size:24px;font-weight:700;letter-spacing:-.03em}
.shares{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--fg2)}
.shares span{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:5px 10px}
.catrow{display:grid;grid-template-columns:64px minmax(0,1fr) 84px;align-items:center;gap:10px;font-size:13.5px}
.catrow .bar{height:8px;border-radius:4px;background:var(--sunken);overflow:hidden}
.catrow .bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.catrow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.xrow{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--soft);width:100%;text-align:left}
.xrow:first-child{border-top:0}
.xrow .xd{font-family:var(--fm);font-size:12px;color:var(--fg3);width:38px;flex-shrink:0;letter-spacing:0}
.xrow .xt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.xrow .xt b{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xrow .xt small{font-size:12px;color:var(--fg3)}
.xrow .xa{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex-shrink:0;font-variant-numeric:tabular-nums}
.xrow .xa b{font-size:15px;font-weight:600}
.xrow .xa small{font-size:11.5px;color:var(--fg3)}
.xrow.settle .xt b{color:var(--green)}
.ctag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--sunken);color:var(--fg2);margin-right:4px}
.ratebox{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ratebox .rl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ratebox .inp{width:110px;height:40px}
.ratebox small{font-size:12px;color:var(--fg3)}
.ratebox .conv{font-weight:700;font-size:16px;color:var(--accent-ink)}
.exgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* gate (첫 실행) */

<script>
(function(){
'use strict';
/* ================= 날짜 · 음력 · 공휴일 (미나의 하루와 같은 코드) ================= */
var WD=['일','월','화','수','목','금','토'];
function pad(n){return (n<10?'0':'')+n}
function iso(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function parse(s){var p=s.split('-');return {y:+p[0],m:+p[1],d:+p[2]}}
function utc(y,m,d){return Date.UTC(y,m-1,d)}
function fromUtc(t){var x=new Date(t);return {y:x.getUTCFullYear(),m:x.getUTCMonth()+1,d:x.getUTCDate()}}
function dow(y,m,d){return new Date(utc(y,m,d)).getUTCDay()}
function addDays(s,n){var p=parse(s),r=fromUtc(utc(p.y,p.m,p.d)+n*864e5);return iso(r.y,r.m,r.d)}
function dim(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function nowLocal(){var x=new Date();return {y:x.getFullYear(),m:x.getMonth()+1,d:x.getDate(),h:x.getHours()}}
var NOW=nowLocal(), TODAY=iso(NOW.y,NOW.m,NOW.d), T0=utc(NOW.y,NOW.m,NOW.d);
function diff(s){var p=parse(s);return Math.round((utc(p.y,p.m,p.d)-T0)/864e5)}
function md(s){var p=parse(s);return p.m+'월 '+p.d+'일 ('+WD[dow(p.y,p.m,p.d)]+')'}
function short(s){var p=parse(s);return p.m+'.'+p.d}

var DF=null; try{DF=new Intl.DateTimeFormat('en-u-ca-dangi',{month:'numeric',day:'numeric',timeZone:'UTC'})}catch(e){}
var LT={};
function lunarTable(y){
  if(LT[y])return LT[y];
  var a=[];
  for(var t=Date.UTC(y,0,1);t<Date.UTC(y+1,0,1);t+=864e5){
    var x=new Date(t),lm='',ld=0;
    if(DF){var p=DF.formatToParts(x);for(var i=0;i<p.length;i++){if(p[i].type==='month')lm=p[i].value;if(p[i].type==='day')ld=+p[i].value}}
    a.push({iso:iso(y,x.getUTCMonth()+1,x.getUTCDate()),lm:lm,ld:ld});
  }
  return LT[y]=a;
}
function lunarToSolar(y,lm,ld){return lunarTable(y).filter(function(r){return r.lm===String(lm)&&r.ld===ld}).map(function(r){return r.iso})}
var HC={};
function holidays(y){
  if(HC[y])return HC[y];
  var H={},sub=[];
  function add(s,n){if(!H[s])H[s]=n}
  [['01-01','신정'],['03-01','삼일절',1],['05-05','어린이날',1],['06-06','현충일'],['08-15','광복절',1],['10-03','개천절',1],['10-09','한글날',1],['12-25','성탄절',1]]
    .forEach(function(h){var s=y+'-'+h[0];add(s,h[1]);if(h[2])sub.push({days:[s],sat:true})});
  var sl=lunarToSolar(y,1,1)[0];
  if(sl){add(addDays(sl,-1),'설날 연휴');add(sl,'설날');add(addDays(sl,1),'설날 연휴');sub.push({days:[addDays(sl,-1),sl,addDays(sl,1)],sat:false})}
  var bd=lunarToSolar(y,4,8)[0]; if(bd){add(bd,'부처님오신날');sub.push({days:[bd],sat:true})}
  var cs=lunarToSolar(y,8,15)[0];
  if(cs){add(addDays(cs,-1),'추석 연휴');add(cs,'추석');add(addDays(cs,1),'추석 연휴');sub.push({days:[addDays(cs,-1),cs,addDays(cs,1)],sat:false})}
  sub.forEach(function(g){
    var need=g.days.some(function(s){var p=parse(s),w=dow(p.y,p.m,p.d);return w===0||(g.sat&&w===6)});
    if(!need)return;
    var s=g.days[g.days.length-1];
    for(var i=0;i<10;i++){s=addDays(s,1);var p=parse(s),w=dow(p.y,p.m,p.d);if(w!==0&&w!==6&&!H[s]){H[s]='대체공휴일';break}}
  });
  return HC[y]=H;
}
var JC={};
function nthMon(y,m,n){var f=dow(y,m,1);return iso(y,m,1+((8-f)%7)+(n-1)*7)}
function jpHolidays(y){
  if(JC[y])return JC[y];
  var H={};function add(s,n){H[s]=n}
  var k=Math.floor((y-1980)/4);
  add(iso(y,1,1),'원일');add(nthMon(y,1,2),'성인의 날');add(iso(y,2,11),'건국기념일');add(iso(y,2,23),'천황탄생일');
  add(iso(y,3,Math.floor(20.8431+0.242194*(y-1980)-k)),'춘분의 날');
  add(iso(y,4,29),'쇼와의 날');add(iso(y,5,3),'헌법기념일');add(iso(y,5,4),'녹색의 날');add(iso(y,5,5),'어린이날');
  add(nthMon(y,7,3),'바다의 날');add(iso(y,8,11),'산의 날');add(nthMon(y,9,3),'경로의 날');

function evRule(e){
  if(e.rr&&e.rr.unit)return e.rr;
  var r=e.repeat||'none',p=parse(e.date);
  if(r==='daily')return {unit:'day',every:1};
  if(r==='weekly')return {unit:'week',every:1,days:[dow(p.y,p.m,p.d)]};
  if(r==='monthly')return {unit:'month',every:1,mt:'date'};
  if(r==='yearly')return {unit:'year',every:1};
  return null;
}
function ruleMatch(date,rr,s,noUntil){
  if(s<date)return false;
  if(!noUntil&&rr.until&&s>rr.until)return false;
  var a=parse(date),b=parse(s),n=Math.max(1,+rr.every||1);
  if(rr.unit==='day')return Math.round((utc(b.y,b.m,b.d)-utc(a.y,a.m,a.d))/864e5)%n===0;
  if(rr.unit==='week'){var ds=(rr.days&&rr.days.length)?rr.days:[dow(a.y,a.m,a.d)];if(ds.indexOf(dow(b.y,b.m,b.d))<0)return false;return (weekIdx(s)-weekIdx(date))%n===0}
  var mo=(b.y-a.y)*12+(b.m-a.m);
  if(rr.unit==='month'){if(mo%n)return false;
    if(rr.mt==='nth'||rr.mt==='last'){if(dow(b.y,b.m,b.d)!==dow(a.y,a.m,a.d))return false;return rr.mt==='last'?b.d+7>dim(b.y,b.m):Math.ceil(b.d/7)===Math.ceil(a.d/7)}
    return b.d===Math.min(a.d,dim(b.y,b.m))}
  if(rr.unit==='year'){if((b.y-a.y)%n)return false;return b.m===a.m&&b.d===Math.min(a.d,dim(b.y,b.m))}
  return false;
}

/* ================= 루틴 (미나의 하루와 같은 코드) ================= */
function weekIdx(t){var p=parse(t);return Math.floor((utc(p.y,p.m,p.d)/864e5+3)/7)}
function monOf(t){var p=parse(t);return addDays(t,-((dow(p.y,p.m,p.d)+6)%7))}
function rtMatch(r,t){var p=parse(t);if(r.mode==='weekly'){if((r.days||[]).indexOf(dow(p.y,p.m,p.d))<0)return false;var w=+r.weeks||1;if(w<2)return true;var k=weekIdx(t)-weekIdx(r.anchor||r.since||TODAY);return ((k%w)+w)%w===0}if(r.mode==='yearly')return p.m===(+r.ym||1)&&p.d===Math.min(+r.yd||1,dim(p.y,p.m));if(r.mode==='monthly'){if(r.mtype==='nth'){if(dow(p.y,p.m,p.d)!==+r.mwd)return false;var n=+r.nth||1;return n>0?Math.ceil(p.d/7)===n:p.d+7>dim(p.y,p.m)}return p.d===Math.min(+r.mday||1,dim(p.y,p.m))}return false}
function rtYearly(r){return r.mode==='yearly'}
var NTH={'1':'첫째','2':'둘째','3':'셋째','4':'넷째','-1':'마지막'};
function rtDue(r){
  if(r.mode==='every'){var e=Math.max(1,+r.every||7);return r.last?addDays(r.last,e):(r.since||TODAY)}
  if(r.mode==='weekly'&&!(r.days||[]).length)return '9999-12-31';
  /* 가장 최근 예정일이 아직 안 했으면 그날이 할 날 (밀린 건 한 번만 표시) */
  for(var b=0;b<=31;b++){var lo=addDays(TODAY,-b);if(rtMatch(r,lo)){if(lo>=(r.since||'')&&(!r.last||r.last<lo))return lo;break}}
  for(var i=1;i<=400;i++){var t=addDays(TODAY,i);if(rtMatch(r,t))return t}
  return '9999-12-31';
}
function rtFreq(r){

/* 시간표 드래그: 빈 곳 = 새 일정, 블록 = 옮기기, 아래 끝 = 길이 (미나의 하루와 같은 코드) */
var TL=null;
function bindTimeline(tl,grid){
  var ghost=document.getElementById('tlghost');
  function minAt(y){var r=grid.getBoundingClientRect();return Math.max(0,Math.min(1440,(y-r.top)/HPX*60))}
  function snap(m){return Math.round(m/15)*15}
  function showGhost(st,en,label){ghost.hidden=false;ghost.style.top=(st/60*HPX)+'px';ghost.style.height=Math.max(18,(en-st)/60*HPX-2)+'px';ghost.firstChild.textContent=label||(fromMin(st)+' – '+fromMin(Math.min(en,1439)))}
  function autoScroll(y){var r=tl.getBoundingClientRect();if(y<r.top+40)tl.scrollTop-=10;else if(y>r.bottom-40)tl.scrollTop+=10}
  function start(){TL.active=true;if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
    if(TL.mode==='create'){TL.st=Math.max(0,Math.min(1380,snap(TL.m0)));TL.en=TL.st+(TL.touch?60:15);showGhost(TL.st,TL.en)}
    if(TL.el)TL.el.classList.add('dragging');}
  grid.addEventListener('pointerdown',function(e){
    if(e.button>0)return;
    var rz=e.target.closest('.tl-rz'),evb=e.target.closest('.tl-ev');
    TL={id:e.pointerId,touch:e.pointerType!=='mouse',y0:e.clientY,m0:minAt(e.clientY),active:false,moved:false};
    if(evb){var ev=find('events',evb.dataset.tlev);if(!ev)return;TL.ev=ev;TL.el=evb;TL.s0=toMin(ev.time);TL.e0=evEndMin(ev);TL.mode=rz?'resize':'move'}
    else TL.mode='create';
    if(!TL.touch||rz){if(rz){TL.active=true;evb.classList.add('dragging')}}
    else TL.timer=setTimeout(function(){if(TL&&!TL.moved){start()}},380);
    try{grid.setPointerCapture(e.pointerId)}catch(_){}
  });
  grid.addEventListener('pointermove',function(e){
    if(!TL||e.pointerId!==TL.id)return;
    var dy=e.clientY-TL.y0;
    if(!TL.active){
      if(Math.abs(dy)>6){TL.moved=true;if(TL.touch){clearTimeout(TL.timer);TL=null;return}start()}else return;
    }
    autoScroll(e.clientY);
    var m=minAt(e.clientY);
    if(TL.mode==='create'){var a=snap(TL.m0),b=snap(m);var st=Math.min(a,b),en=Math.max(a,b);if(en-st<15)en=st+15;if(TL.touch&&!TL.moved2&&Math.abs(dy)<8){st=TL.st;en=TL.en}else TL.moved2=true;TL.st=st;TL.en=Math.min(en,1440);showGhost(TL.st,TL.en)}
    else if(TL.mode==='move'){var d=snap(m-TL.m0),len=TL.e0-TL.s0,ns=Math.max(0,Math.min(1440-len,TL.s0+d));TL.ns=ns;TL.ne=ns+len;TL.el.style.top=(ns/60*HPX)+'px';TL.el.querySelector('small').textContent=fromMin(ns)+'–'+fromMin(Math.min(ns+len,1439))}
    else if(TL.mode==='resize'){var ne=Math.max(TL.s0+15,Math.min(1440,snap(m)));TL.ne=ne;TL.ns=TL.s0;TL.el.style.height=Math.max(18,(ne-TL.s0)/60*HPX-2)+'px';TL.el.querySelector('small').textContent=fromMin(TL.s0)+'–'+fromMin(Math.min(ne,1439))}
  });
  function end(e,cancel){
    if(!TL||e.pointerId!==TL.id)return;var t=TL;TL=null;clearTimeout(t.timer);ghost.hidden=true;
    if(cancel)return render();
    if(!t.active){
      if(t.moved)return;
      if(t.ev){openSheet('event',editEvent(t.ev));return}
      var st=Math.min(1380,Math.floor(t.m0/60)*60);newEventAt(cal.sel,st,st+60);return;
    }
    if(t.mode==='create'){newEventAt(cal.sel,t.st,t.en);return}
    if((t.mode==='move'||t.mode==='resize')&&t.ns!=null&&(t.ns!==t.s0||t.ne!==t.e0)){var ne=copy(t.ev);ne.time=fromMin(t.ns);ne.end=fromMin(Math.min(t.ne,1439));put('events',ne);toast((evRule(t.ev)?'반복 일정 전체를 ':'')+fromMin(t.ns)+'로 옮겼어요');return}
    render();
  }
  grid.addEventListener('pointerup',function(e){end(e,false)});
  grid.addEventListener('pointercancel',function(e){end(e,true)});
  grid.addEventListener('touchmove',function(e){if(TL&&TL.active)e.preventDefault()},{passive:false});
  grid.addEventListener('contextmenu',function(e){e.preventDefault()});
}

/* ================= 지출 (Tricount 방식) =================
   spaces/{sid}/expenses
   지출: {kind:'expense', title, amount, cur, rate(1단위당 엔), jpy, date, cat, paidBy, split:'half'|'ratio'|'exact'|'one',
          pct:{uid:%}, exact:{uid:원래 통화 금액}, one:uid, owe:{uid:엔}, note, createdAt, by}
   정산: {kind:'settle', from, to, jpy, date, note, createdAt, by}  (from이 to에게 보냄) */
function isSettle(x){return x.kind==='settle'}
function netBalances(){
  var net={};members().forEach(function(u){net[u]=0});
  S.expenses.forEach(function(x){
    if(isSettle(x)){net[x.from]=(net[x.from]||0)+(+x.jpy||0);net[x.to]=(net[x.to]||0)-(+x.jpy||0);return}
    net[x.paidBy]=(net[x.paidBy]||0)+(+x.jpy||0);
    var o=x.owe||{};Object.keys(o).forEach(function(u){net[u]=(net[u]||0)-(+o[u]||0)});
  });
  return net;
}
/* 누가 누구에게 얼마 보내면 되는지 (두 사람 기준) */
function balance(){
  var net=netBalances(),a=me(),b=partnerUid(),v=Math.round(net[a]||0);
  if(!b||Math.abs(v)<1)return {even:true,amt:0};
  return v>0?{from:b,to:a,amt:v}:{from:a,to:b,amt:-v};
}
function balText(bl){
  if(bl.even)return '정산 끝! 서로 보낼 돈이 없어요';
  var f=bl.from===me()?'내가':josa(fullName(bl.from),'이','가');
  return f+' '+(bl.to===me()?'나':fullName(bl.to))+'에게 <span class="amt">'+yen(bl.amt)+'</span> 보내면 정산 끝';
}

}
function expCalc(d){
  var amt=numIn(d.amount),cur=d.cur||'JPY',rate=cur==='JPY'?1:(+d.rate||0);
  var r={jpy:0,owe:{},ok:false,err:''},a=me(),b=partnerUid();
  if(!amt){r.err='';return r}
  if(cur!=='JPY'&&!rate){r.err='환율을 넣어주세요';return r}
  var jpy=Math.round(amt*rate);r.jpy=jpy;
  if(!b){r.err='상대가 연결되면 나눌 수 있어요';return r}
  if(d.split==='ratio'){var pa=Math.max(0,Math.min(100,numIn(d.pa)));r.owe[a]=Math.round(jpy*pa/100);r.owe[b]=jpy-r.owe[a]}
  else if(d.split==='exact'){var xa=numIn(d.xa),xb=numIn(d.xb);
    if(Math.abs(xa+xb-amt)>0.005){r.err='두 금액의 합이 '+money(amt,cur)+'이 되어야 해요 (지금 '+money(xa+xb,cur)+')';return r}
    r.owe[a]=Math.round(xa*rate);r.owe[b]=jpy-r.owe[a]}
  else if(d.split==='one'){var one=d.one||a;r.owe[a]=one===a?jpy:0;r.owe[b]=one===b?jpy:0}
  else{r.owe[b]=Math.round(jpy/2);r.owe[a]=jpy-r.owe[b]}
  r.ok=true;return r;
}
function expPreview(d){
  var c=expCalc(d),a=me(),b=partnerUid();
  if(c.err)return '<span class="err">'+esc(c.err)+'</span>';
  if(!c.ok)return '<span class="pl muted">금액을 넣으면 누가 얼마 내는지 보여요</span>';
  var payer=d.paidBy||a,other=payer===a?b:a,o=c.owe[other]||0;

var RATES=lsGet('rates',{});
function fetchJSON(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
function pickJPY(j){
  if(!j)return 0;
  if(j.rates&&+j.rates.JPY)return +j.rates.JPY;
  if(+j.rate)return +j.rate;
  if(Array.isArray(j)){for(var i=0;i<j.length;i++){var x=j[i];if(x&&(x.quote==='JPY'||x.symbol==='JPY')&&+x.rate)return +x.rate}}
  return 0;
}
function fetchRate(cur,date){
  if(cur==='JPY')return Promise.resolve({rate:1,src:''});
  var k=cur+'|'+date;if(RATES[k])return Promise.resolve(RATES[k]);
  var day=date>TODAY?TODAY:date;
  var tries=[
    'https://api.frankfurter.dev/v1/'+day+'?base='+cur+'&symbols=JPY',
    'https://api.frankfurter.dev/v2/rates?date='+day+'&base='+cur+'&quotes=JPY',
    'https://open.er-api.com/v6/latest/'+cur
  ];
  function t(i){if(i>=tries.length)return Promise.reject();return fetchJSON(tries[i]).then(function(j){var r=pickJPY(j);if(!r)throw 0;var o={rate:r,src:i<2?(j.date||day):'최근'};if(i<2)RATES[k]=o,lsSet('rates',RATES);return o}).catch(function(){return t(i+1)})}
  return t(0);
}

function loadFirebase(){
  var V='10.14.1',bases=['https://www.gstatic.com/firebasejs/'+V+'/','https://cdn.jsdelivr.net/npm/firebase@'+V+'/'];
  function tryBase(i){
    if(i>=bases.length)return Promise.reject();
    var B=bases[i];
    return loadScript(B+'firebase-app-compat.js').then(function(){return Promise.all([loadScript(B+'firebase-auth-compat.js'),loadScript(B+'firebase-firestore-compat.js')])}).catch(function(){return tryBase(i+1)});

}
