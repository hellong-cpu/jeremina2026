# One-off device check for Jeremina notifications. Default delivers nothing; send_test sends a test notice.
name: Notifications check
on:
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send a test notification to every device'
        type: boolean
        default: false
      only_member:
        description: 'Only this member number (1 or 2); empty = everyone'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/notify
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: .github/notify
        run: npm install --omit=dev --no-audit --no-fund --loglevel=error
      - working-directory: .github/notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ONLY_MEMBER: ${{ inputs.only_member }}
        run: node notify.js ${{ inputs.send_test && '--test' || '--diag' }}
