# Jeremina push notifications.
# - Started by hand (or by itself): checks every 5 minutes for ~5h40m, then starts the next run.
#   (GitHub allows a workflow to start itself with workflow_dispatch.)
# - The cron schedule is a backup in case that chain ever stops.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT. Logs show counts only.
name: Notifications
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/notify
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: .github/notify
        run: npm install --omit=dev --no-audit --no-fund --loglevel=error
      - name: Send
        working-directory: .github/notify
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LOOP: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          start=$(date +%s)
          while true; do
            node notify.js || true
            [ -z "$LOOP" ] && break
            [ $(( $(date +%s) - start )) -gt 20400 ] && break   # ~5h40m
            sleep $(( 300 - ($(date +%s) - start) % 300 ))
          done
      - name: Start the next run
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/notify.yml/dispatches" -f ref=main && echo "Next run started."
      # GitHub turns off scheduled workflows after 60 days without repo activity.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/notify.yml/enable" >/dev/null && echo "Schedule kept alive." || true
